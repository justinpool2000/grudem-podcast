name: Publish podcast feed

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create podcast files
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > feed.xml
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayne Grudem - Systematic Theology Feed</title></head>
          <body>
          <h1>Wayne Grudem - Systematic Theology</h1>
          <p>Personal-use RSS wrapper for the publicly hosted Systematic Theology audio archive.</p>
          <p><a href="feed.xml">RSS Feed</a></p>
          <p>Audio files remain hosted by WayneGrudem.com.</p>
          </body></html>
          EOF
          touch .nojekyll
          cat > README.md <<'EOF'
          # Grudem Systematic Theology podcast feed

          A personal-use RSS wrapper for Wayne Grudem's publicly hosted Systematic Theology audio archive.

          Audio files remain hosted by WayneGrudem.com. The feed organizes the available recordings into sequential podcast episodes for easier offline listening.
          EOF
      - name: Commit podcast files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html .nojekyll README.md
          git commit -m "Publish podcast feed" || exit 0
          git push
