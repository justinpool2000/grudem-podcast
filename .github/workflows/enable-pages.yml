name: Enable GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          cat response.json
          if [ "$code" = "201" ]; then
            echo "GitHub Pages enabled."
          elif [ "$code" = "409" ]; then
            echo "GitHub Pages already exists; updating source."
            curl -sS -f \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
              -d '{"source":{"branch":"main","path":"/"}}'
          else
            echo "Unexpected HTTP status: $code"
            exit 1
          fi
